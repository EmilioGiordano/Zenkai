<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Close app, list dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7fb894}a:hover{color:#a6d3b5}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input[type=checkbox]{accent-color:#4caf7a;width:15px;height:15px;margin:0}
</style>
</helmet>
<div style="position: relative; width: 880px; height: 560px; overflow: hidden; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; background: #18191b; color: #e4e4e6">
  <div style="height: 40px; background: #1f2023"></div>
  <div style="position: absolute; top: 40px; left: 0; right: 0; bottom: 0; background-image: linear-gradient(#26272a 1px, transparent 1px), linear-gradient(90deg, #26272a 1px, transparent 1px); background-size: 96px 26px"></div>
  <div style="position: absolute; inset: 0; background: rgba(8, 8, 10, 0.55)"></div>

  <div role="dialog" aria-labelledby="t2" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 520px; box-sizing: border-box; padding: 22px 24px 20px; border-radius: 12px; background: #222326; box-shadow: 0 18px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <h2 id="t2" style="margin: 0; font-size: 15px; font-weight: 600">3 workbooks have unsaved changes</h2>
      <p style="margin: 0; color: #a3a5ab; line-height: 1.5">Choose which ones to save before Zenkai closes.</p>
    </div>

    <div style="display: flex; flex-direction: column; border-radius: 8px; background: #1f2023; padding: 4px">
      <label style="display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 12px; color: #a3a5ab; font-size: 12px">
        <input type="checkbox" checked aria-label="Select all">
        <span style="flex-grow: 1">Select all</span>
        <span>3 of 3 selected</span>
      </label>
      <div style="height: 1px; margin: 0 12px; background: #2a2b2f"></div>
      <label style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px">
        <input type="checkbox" checked>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span>Sales 2026.xlsx</span>
          <span style="font-size: 11.5px; color: #767880; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">D:\Reports\2026</span>
        </span>
        <span style="font-size: 12px; color: #a3a5ab">edited 4 min ago</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px">
        <input type="checkbox" checked>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span>Budget.xlsx</span>
          <span style="font-size: 11.5px; color: #767880">C:\Users\me\Documents</span>
        </span>
        <span style="font-size: 12px; color: #a3a5ab">edited 1 h ago</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 6px">
        <input type="checkbox" checked>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span>Book1</span>
          <span style="font-size: 11.5px; color: #767880">Never saved, asks where to save</span>
        </span>
        <span style="font-size: 12px; color: #a3a5ab">edited now</span>
      </label>
    </div>

    <label style="display: flex; align-items: center; gap: 10px; color: #a3a5ab">
      <input type="checkbox" checked>
      <span>Reopen these tabs next time</span>
    </label>

    <div style="display: flex; gap: 8px; justify-content: flex-end">
      <button style="height: 34px; padding: 0 16px; border-radius: 8px; background: #2a2b2f">Don't Save</button>
      <button style="height: 34px; padding: 0 16px; border-radius: 8px; background: #2a2b2f">Cancel</button>
      <button style="height: 34px; padding: 0 18px; border-radius: 8px; background: #4caf7a; color: #0f1a13; font-weight: 600; outline: 2px solid #5b8def; outline-offset: 2px">Save selected</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
