name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version

      - name: Install GPUI system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libvulkan1

      - name: Install the Metal toolchain if Xcode lacks it (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release -p zenkai -p zenkai-mcp -p zenkai-pdf-host

      - name: Fetch pdfium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/fetch-pdfium.ps1 -Destination target/release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "zenkai-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/zenkai.exe, target/release/zenkai-mcp.exe, target/release/zenkai-pdf-host.exe, target/release/pdfium.dll, target/release/pdfium-LICENSE.txt, LICENSE, README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          name="zenkai-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/zenkai target/release/zenkai-mcp target/release/zenkai-pdf-host LICENSE README.md "$name"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: zenkai-${{ matrix.target }}
          path: |
            zenkai-*.zip
            zenkai-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: zenkai-*
          merge-multiple: true

      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md does not exist; add it before tagging."
            exit 1
          fi
          awk -v header="## [$version]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section '## [$version]' with content."
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" zenkai-*.zip zenkai-*.tar.gz \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
