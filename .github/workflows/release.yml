name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      keys: ${{ steps.keys.outputs.keys }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check the tag is on main and matches the app version
        id: version
        run: |
          rustup toolchain install
          version="${GITHUB_REF_NAME#v}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main."
            exit 1
          fi
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "zenkai") | .version')
          if [ "$crate" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version $crate."
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

      # Without the real pair the shipped app could never install an update, nor any later one.
      - name: Check the app carries the real update keys
        id: keys
        run: |
          keys=$(awk '/^const RELEASE_KEYS/ { inside = 1 } inside { print } inside && /\];/ { exit }' \
            crates/app/src/updates/signature.rs | grep -oE '"RW[A-Za-z0-9+/]{54}"' | tr -d '"' | sort -u)
          if [ "$(wc -w <<< "$keys")" -ne 2 ]; then
            echo "::error::RELEASE_KEYS in crates/app/src/updates/signature.rs must hold the current and next public keys (docs/RELEASING.md)."
            exit 1
          fi
          for key in $keys; do
            if [ "$(grep -cF "\"$key\"" crates/app/src/updates/signature.rs)" -ne 1 ]; then
              echo "::error::The release key $key is also listed as a TEST key."
              exit 1
            fi
          done
          echo "keys=$(tr '\n' ' ' <<< "$keys")" >> "$GITHUB_OUTPUT"

      - name: Extract the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md does not exist; add it before tagging."
            exit 1
          fi
          awk -v header="## [$version]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section '## [$version]' with content."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notes
          path: notes.md

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    timeout-minutes: 90
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            launcher: -p zenkai-launcher
          - os: ubuntu-latest
            target: linux-x64
            launcher: ""
          - os: macos-latest
            target: macos-arm64
            launcher: ""
    runs-on: ${{ matrix.os }}
    env:
      REF_NAME: ${{ github.ref_name }}
      # One list for the key guard and the build, so the guard checks what is shipped.
      RELEASE_PACKAGES: -p zenkai -p zenkai-mcp -p zenkai-pdf-host -p zenkai-values-host ${{ matrix.launcher }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version

      - name: Install GPUI system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libvulkan1

      - name: Install the Metal toolchain if Xcode lacks it (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      # The TEST update keys have committed secrets: a shipped app must never trust them.
      - name: Refuse the test update keys
        shell: bash
        run: |
          tree=$(cargo tree --locked -e features --prefix none -i zenkai $RELEASE_PACKAGES)
          if grep -F 'zenkai feature "test-keys"' <<< "$tree"; then
            echo "the release build enables the test-keys feature" >&2
            exit 1
          fi

      - name: Build
        shell: bash
        run: cargo build --locked --profile dist $RELEASE_PACKAGES

      - name: Fetch pdfium (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/fetch-pdfium.ps1 -Destination target/dist

      - name: Package the zip and the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "zenkai-$env:REF_NAME-${{ matrix.target }}"
          $iscc = ./packaging/windows/fetch-inno-setup.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'inno-setup')
          ./packaging/windows/package.ps1 -ExeDir target/dist -Version $env:REF_NAME.Substring(1) -Name $name -OutputDir . -Iscc $iscc
          $setup = "$name-setup.exe"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD "$setup.sha256"), "$hash  $setup`n")

      - name: Test the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-install.ps1 -Setup "zenkai-$env:REF_NAME-${{ matrix.target }}-setup.exe"

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          name="zenkai-$REF_NAME-${{ matrix.target }}"
          mkdir "$name"
          cp target/dist/zenkai target/dist/zenkai-mcp target/dist/zenkai-pdf-host target/dist/zenkai-values-host LICENSE README.md "$name"
          tar -czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zenkai-${{ matrix.target }}
          path: |
            zenkai-*.zip
            zenkai-*-setup.exe
            zenkai-*-setup.exe.sha256
            zenkai-*.tar.gz
          if-no-files-found: error

  # Holds the signing secret, so it runs no code from the repository or its dependencies:
  # it only downloads the built zips, a pinned minisign, and signs.
  sign:
    name: Sign the update zips
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release-signing
    permissions: {}
    defaults:
      run:
        shell: bash
    env:
      REF_NAME: ${{ github.ref_name }}
      APP_VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_KEYS: ${{ needs.verify.outputs.keys }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: zenkai-*
          merge-multiple: true
          path: artifacts

      # jedisct1/minisign 0.12; the hash is of the tarball its author's key signs.
      - name: Install minisign
        run: |
          mkdir "$RUNNER_TEMP/minisign"
          cd "$RUNNER_TEMP/minisign"
          curl -fsSL --proto '=https' -o minisign.tar.gz \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  minisign.tar.gz" | sha256sum --check --strict
          tar --warning=no-unknown-keyword -xzf minisign.tar.gz minisign-linux/x86_64/minisign
          echo "$RUNNER_TEMP/minisign/minisign-linux/x86_64" >> "$GITHUB_PATH"

      - name: Sign every zip as zenkai/<version>/<platform>
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          version="${REF_NAME#v}"
          if [ "$version" != "$APP_VERSION" ]; then
            echo "::error::Tag $REF_NAME does not match the app version $APP_VERSION."
            exit 1
          fi
          if [ -z "$MINISIGN_SECRET_KEY" ] || [ -z "$MINISIGN_PASSWORD" ]; then
            echo "::error::The release-signing environment lacks MINISIGN_SECRET_KEY or MINISIGN_PASSWORD."
            exit 1
          fi
          key="$RUNNER_TEMP/zenkai.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          shopt -s nullglob
          zips=(artifacts/zenkai-*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::The builds produced no zip to sign."
            exit 1
          fi
          mkdir signatures
          for zip in "${zips[@]}"; do
            name=$(basename "$zip")
            platform="${name#"zenkai-$REF_NAME-"}"
            platform="${platform%.zip}"
            # The updater's PLATFORM names (crates/app/src/updates/signature.rs).
            case "$platform" in
              windows-x64 | windows-arm64) ;;
              *)
                echo "::error::$name is not named zenkai-$REF_NAME-<platform>.zip for a platform the updater knows."
                exit 1
                ;;
            esac
            comment="zenkai/$version/$platform"
            printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$zip" -x "signatures/$name.minisig" -t "$comment"
            signed=""
            for public in $RELEASE_KEYS; do
              if signed=$(minisign -V -Q -P "$public" -m "$zip" -x "signatures/$name.minisig" 2>/dev/null); then
                break
              fi
            done
            if [ "$signed" != "$comment" ]; then
              echo "::error::$name.minisig does not verify as $comment with a key the app trusts."
              exit 1
            fi
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signatures
          path: signatures/*.minisig
          if-no-files-found: error

  release:
    name: Publish release
    needs: [verify, build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: zenkai-*
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: notes

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signatures

      - name: Write checksums
        run: sha256sum zenkai-*.zip zenkai-*-setup.exe zenkai-*.tar.gz > SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" zenkai-*.zip zenkai-*.zip.minisig zenkai-*-setup.exe zenkai-*-setup.exe.sha256 zenkai-*.tar.gz SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md "${prerelease[@]}"
