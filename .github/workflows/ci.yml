name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "scripts/**"
      - "**.md"
      - ".claude/**"
      - ".agents/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "scripts/**"
      - "**.md"
      - ".claude/**"
      - ".agents/**"
  # macOS is manual only: its minutes cost 10x those of Linux.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Full debug info for GPUI fills the runner disk and the cache; tests do not need it.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    # Manual run: macOS, everything. Draft PR: fmt and clippy on Linux. Ready PR: everything on
    # Linux and Windows. Push to main: fmt and clippy on Linux, which also warms the cache.
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["macos-latest"]' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false && '["ubuntu-latest","windows-latest"]') || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Two commits so the vendor step can diff the merge commit against the base.
          fetch-depth: 2

      - name: Install the toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version

      - name: Install GPUI system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            libvulkan1

      - name: Install the Metal toolchain if Xcode lacks it (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
        run: cargo test

      - name: Test the vendored crates if the PR touches vendor
        if: runner.os == 'Linux' && github.event_name == 'pull_request' && !github.event.pull_request.draft
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -q '^vendor/'; then
            for manifest in vendor/ironcalc_base/Cargo.toml vendor/ironcalc/Cargo.toml; do
              if [ -f "$manifest" ]; then
                cargo test --manifest-path "$manifest"
              fi
            done
          fi
