[package]
name = "zenkai-values-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The library holds the frame messages and the client the app uses; the binary reads a
# workbook with calamine in its own process, so a panic, an abort, an out-of-memory failure
# or an endless loop inside calamine can only cost that process.
[lib]
path = "src/lib.rs"

[[bin]]
name = "zenkai-values-host"
path = "src/main.rs"

[[bin]]
name = "fake-values-host"
path = "src/bin/fake_values_host.rs"
required-features = ["fake-host"]

[features]
fake-host = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
zenkai-formats = { path = "../formats" }
zenkai-pdf-host = { path = "../pdf-host", default-features = false }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"
zenkai-values-host = { path = ".", features = ["fake-host"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }

[lints]
workspace = true
