[package]
name = "zenkai-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Shipped as `zenkai.exe` at the root of the Windows install, which the updater never replaces:
# no network, no keys, no GPUI and no Zenkai crate.
[[bin]]
name = "zenkai-launcher"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
sys-locale = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
winsafe = { version = "=0.0.29", default-features = false, features = ["user"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
