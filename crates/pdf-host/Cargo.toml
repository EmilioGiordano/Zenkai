[package]
name = "zenkai-pdf-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The library holds the wire format and the client the app uses to talk to the host. The
# binary reads PDFs with pdfium and is the only code that depends on pdfium-render.
[lib]
path = "src/lib.rs"

[[bin]]
name = "zenkai-pdf-host"
path = "src/main.rs"
required-features = ["host"]

[features]
default = ["host"]
host = ["dep:pdfium-render"]

[dependencies]
async-channel = "2"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
