[package]
name = "zenkai-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
keyring-core = "=1.0.0"
notify = "=8.2.0"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
