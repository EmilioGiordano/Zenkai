[package]
name = "zenkai-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-support = []

[dependencies]
async-channel = "2"
getrandom = "0.3"
keyring-core = "=1.0.0"
notify = "=8.2.0"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
which = "8"
zenkai-engine = { path = "../engine" }
zenkai-types = { path = "../types" }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "=1.1.0"

[dev-dependencies]
futures-lite = "2"
rust_xlsxwriter = "0.92"
tempfile = "3"

[lints]
workspace = true
