[package]
name = "zenkai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zenkai"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gpui-kit = "=0.7.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zenkai-engine = { path = "../engine" }
zenkai-grid = { path = "../grid" }
zenkai-types = { path = "../types" }

[lints]
workspace = true
