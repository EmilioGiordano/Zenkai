[package]
name = "zenkai"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zenkai"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui-kit = "=0.7.1"
memory-stats = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zenkai-engine = { path = "../engine" }
zenkai-formats = { path = "../formats" }
zenkai-grid = { path = "../grid" }
zenkai-types = { path = "../types" }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tempfile = "3"

[lints]
workspace = true
