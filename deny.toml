# The benchmark tool keeps logisheets-rs for comparison; it never ships nor opens user files.
[graph]
all-features = false
exclude = ["zenkai-bench"]

[advisories]
version = 2
yanked = "warn"
# Unmaintained crates deep in the GPUI tree are tracked upstream; direct ones must be replaced.
unmaintained = "workspace"
# zip 0.6 advisories where only ZipArchive::extract() is affected; no code path calls it.
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "extract() is never called; vendored ironcalc and the xlsx crates still use zip 0.6" },
    { id = "RUSTSEC-2026-0368", reason = "extract() is never called; vendored ironcalc and the xlsx crates still use zip 0.6" },
    { id = "RUSTSEC-2026-0369", reason = "extract() is never called; vendored ironcalc and the xlsx crates still use zip 0.6" },
    { id = "RUSTSEC-2026-0429", reason = "extract() is never called; vendored ironcalc and the xlsx crates still use zip 0.6" },
    # Unreachable in zip 0.6 as built here: AES decryption is compiled out and nothing reads entries from a stream.
    { id = "RUSTSEC-2026-0545", reason = "no crate enables zip's aes-crypto feature, so AES entries fail to open; no decrypt call exists" },
    { id = "RUSTSEC-2026-0548", reason = "ZipStreamReader and read_zipfile_from_stream are never called; entries are read through ZipArchive by central directory name" },
    # Replacing chrono in the app would not drop it: ironcalc_base, gpui, pdfium-render, rmcp and schemars pull it.
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no safe upgrade; it stays in the tree through ironcalc_base, gpui, rmcp and schemars" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "bzip2-1.0.6",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
