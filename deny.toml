# The benchmark tool keeps logisheets-rs for comparison; it never ships nor opens user files.
[graph]
all-features = false
exclude = ["zenkai-bench"]

[advisories]
version = 2
yanked = "warn"
# Unmaintained crates deep in the GPUI tree are tracked upstream; direct ones must be replaced.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "bzip2-1.0.6",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
