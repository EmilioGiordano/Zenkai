[workspace]
resolver = "3"
members = ["bench", "crates/types", "crates/engine", "crates/formats", "crates/grid", "crates/app"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
debug = "line-tables-only"
