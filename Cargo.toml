[workspace]
resolver = "3"
members = [
    "bench",
    "crates/types",
    "crates/engine",
    "crates/formats",
    "crates/grid",
    "crates/agent",
    "crates/app",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
debug = "line-tables-only"

# Shipped builds only: fat LTO over the GPUI tree is too slow for the release dev loop and
# the benchmark. Unwinding stays on because engine panics are caught at a thread join.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = true
