[workspace]
resolver = "3"
members = [
    "bench",
    "crates/types",
    "crates/i18n",
    "crates/datagen",
    "crates/engine",
    "crates/formats",
    "crates/grid",
    "crates/agent",
    "crates/mcp-relay",
    "crates/fake-acp-agent",
    "crates/app",
]
# Third-party code patched for Zenkai: built as a dependency, outside our fmt and clippy gates.
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.release]
debug = "line-tables-only"

# Shipped builds only: fat LTO over the GPUI tree is too slow for the release dev loop and
# the benchmark. Unwinding stays on because engine panics are caught at a thread join.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = false
strip = true

[patch.crates-io]
ironcalc_base = { path = "vendor/ironcalc_base" }
