[workspace]
resolver = "3"
members = ["bench", "crates/types", "crates/engine", "crates/formats", "crates/grid", "crates/app"]
# Third-party code patched for Zenkai: built as a dependency, outside our fmt and clippy gates.
exclude = ["vendor"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
debug = "line-tables-only"

[patch.crates-io]
ironcalc_base = { path = "vendor/ironcalc_base" }
